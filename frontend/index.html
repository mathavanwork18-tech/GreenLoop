    <!-- Early PWA Install Prompt Capture -->
    <script>
      window.__glInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__glInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('gl-pwa-prompt-ready'));
        console.log('[PWA Head] beforeinstallprompt captured early');
      });
    </script>
